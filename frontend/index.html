<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EASY-CHATGPT</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="chat-panel" aria-label="Chat">
        <header class="header">
          <div>
            <p class="eyebrow">Baseline LLM proxy</p>
            <h1>EASY-CHATGPT</h1>
          </div>
          <button id="clearButton" class="secondary" type="button">Clear</button>
        </header>

        <div id="chatLog" class="chat-log" aria-live="polite"></div>

        <form id="chatForm" class="composer">
          <label class="sr-only" for="messageInput">Message</label>
          <textarea
            id="messageInput"
            name="message"
            rows="3"
            placeholder="Ask something..."
            required
          ></textarea>
          <button id="sendButton" type="submit">Send</button>
        </form>
      </section>

      <aside class="context-panel" aria-label="Context and token usage">
        <header>
          <p class="eyebrow">Model context</p>
          <h2>Messages + tokens</h2>
        </header>
        <div id="usageSummary" class="usage-summary">No requests yet.</div>
        <pre id="contextView" class="context-view">[]</pre>
      </aside>
    </main>

    <script src="/assets/app.js"></script>
  </body>
</html>
